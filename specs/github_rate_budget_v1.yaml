meta:
  spec_id: github_rate_budget_v1
  version: 1
  status: active
  owner: github_transport

scope:
  budget_identity: authentication_credential_identity
  shared_across_all_configured_mailboxes_for_identity: true
  all_github_requests_use_governor: true
  bypass_is_forbidden: true

request_model:
  serialized_requests: true
  maximum_concurrency_per_identity: 1
  minimum_mutation_spacing_ms: 1000
  default_api_version: 2026-03-10
  api_version_is_explicit_and_configurable: true
  stable_user_agent_required: true

polling:
  authenticated: required
  conditional_requests: required_after_first_success
  persist_etag_and_last_modified: true
  honor_x_poll_interval_floor: true
  default_active_interval_ms: 30000
  default_idle_interval_ms: 120000
  default_maximum_idle_interval_ms: 900000
  adaptive_backoff_after_unchanged_poll: true
  bounded_jitter_ratio: 0.10
  no_rate_limit_endpoint_heartbeat: true
  narrow_stable_endpoints_preferred: true
  pagination_follows_link_header_only: true
  process_oldest_first: true

primary_limit:
  observe_headers_on_every_response:
    - x-ratelimit-resource
    - x-ratelimit-limit
    - x-ratelimit-remaining
    - x-ratelimit-used
    - x-ratelimit-reset
  default_conservation_remaining: 750
  default_critical_reserve_remaining: 200
  default_conservation_ratio: 0.20
  background_requests_yield_first: true
  normal_progress_collapses_to_terminal_only_in_conservation: true
  critical_reserve_uses:
    - terminal_report
    - cancellation_acknowledgement
    - safety_warning

secondary_limit:
  status_codes: [403, 429]
  retry_after_has_priority: true
  zero_remaining_waits_until_reset: true
  otherwise_initial_backoff_ms: 60000
  exponential_backoff: true
  maximum_backoff_ms: 3600000
  maximum_retry_attempts: 6
  continuing_while_limited_is_forbidden: true

mutation_coalescing:
  lifecycle_comment_count_per_dispatch: 1
  default_minimum_remote_update_interval_ms: 60000
  default_maximum_silence_ms: 600000
  immediate_candidate_events:
    - accepted
    - rejected
    - phase_failure
    - terminal
  immediate_does_not_bypass_mutation_spacing_or_rate_block: true
  rapid_events_keep_latest_material_state: true

observability:
  locally_log_request_purpose_status_and_budget: true
  never_log_authorization_header: true
  report_degraded_rate_mode_without_exposing_token_identity: true
