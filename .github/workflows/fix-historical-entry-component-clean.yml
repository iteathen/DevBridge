name: Temporary clean historical entry repair

on:
  push:
    branches:
      - fix/362-historical-entry-component-verification-clean

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Apply closed historical-membership correction
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync, appendFileSync } from 'node:fs';

          const installerPath = 'src/install/permanent-entry-installer.mjs';
          let installer = readFileSync(installerPath, 'utf8');
          const sourceMarker = "export const SOURCE_REPOSITORY = 'https://github.com/iteathen/DevBridge.git';\n";
          if (!installer.includes(sourceMarker)) throw new Error('installer source marker changed');
          const historicalBlock = `
          // Closed compatibility set for permanent-entry components produced before runner-cache
          // ownership/runtime bricks became part of the installed entry closure. Historical
          // references must match this set exactly; arbitrary subsets are not accepted.
          const HISTORICAL_COMPONENT_FILE_SETS = Object.freeze([
            Object.freeze([
              'devbridge-entry.mjs',
              'src/entry/content-addressed-runner-provider.mjs',
              'src/entry/development-checkout-runner-provider.mjs',
              'src/entry/development-stable-subject-authority.mjs',
              'src/entry/exact-checkout-runner-provider.mjs',
              'src/entry/experimental-checkout-runner-provider.mjs',
              'src/entry/experimental-entry.mjs',
              'src/entry/experimental-subject-authority.mjs',
              'src/entry/github-runner-source.mjs',
              'src/entry/installation-identity.mjs',
              'src/entry/permanent-entry.mjs',
              'src/entry/production-stable-subject-authority.mjs',
              'src/entry/stable-entry.mjs',
              'src/entry/stable-runner-state.mjs',
            ]),
          ]);
          `;
          installer = installer.replace(sourceMarker, `${sourceMarker}${historicalBlock}`);

          const currentStore = `const componentStore = createComponentStore({
            protocol: INSTALL_PROTOCOL,
            files: INSTALLED_COMPONENT_FILES,
            defaultEndpoint: SOURCE_REPOSITORY,
            manifestName: '.devbridge-entry-install.json',
            endpointField: 'sourceRepository',
          });`;
          if (!installer.includes(currentStore)) throw new Error('component store composition changed');
          const storeComposition = `function createEntryComponentStore(files) {
            return createComponentStore({
              protocol: INSTALL_PROTOCOL,
              files,
              defaultEndpoint: SOURCE_REPOSITORY,
              manifestName: '.devbridge-entry-install.json',
              endpointField: 'sourceRepository',
            });
          }
          const componentStore = createEntryComponentStore(INSTALLED_COMPONENT_FILES);
          const historicalComponentStores = Object.freeze(
            HISTORICAL_COMPONENT_FILE_SETS.map((files) => createEntryComponentStore(files)),
          );`;
          installer = installer.replace(currentStore, storeComposition);

          const callbackStart = installer.indexOf('acceptReference: (reference) => componentStore.verify(');
          if (callbackStart < 0) throw new Error('reference verifier start changed');
          const callbackEndMarker = '\n      ),';
          const callbackEnd = installer.indexOf(callbackEndMarker, callbackStart);
          if (callbackEnd < 0) throw new Error('reference verifier end changed');
          const historicalReference = `acceptReference: (reference) => {
                const componentRoot = path.join(components, reference.subject);
                return componentStore.verify(componentRoot, reference.subject, sourceRepository)
                  || historicalComponentStores.some((store) => store.verify(
                    componentRoot,
                    reference.subject,
                    sourceRepository,
                  ));
              },`;
          installer = `${installer.slice(0, callbackStart)}${historicalReference}${installer.slice(callbackEnd + callbackEndMarker.length)}`;
          writeFileSync(installerPath, installer);

          const testPath = 'test/self-install-entry.test.js';
          const tests = readFileSync(testPath, 'utf8');
          if (tests.includes('historical permanent-entry membership upgrades through exact closed compatibility')) {
            throw new Error('historical regression test already exists');
          }
          const regression = `
          const HISTORICAL_ENTRY_COMPONENT_FILES = Object.freeze([
            'devbridge-entry.mjs',
            'src/entry/content-addressed-runner-provider.mjs',
            'src/entry/development-checkout-runner-provider.mjs',
            'src/entry/development-stable-subject-authority.mjs',
            'src/entry/exact-checkout-runner-provider.mjs',
            'src/entry/experimental-checkout-runner-provider.mjs',
            'src/entry/experimental-entry.mjs',
            'src/entry/experimental-subject-authority.mjs',
            'src/entry/github-runner-source.mjs',
            'src/entry/installation-identity.mjs',
            'src/entry/permanent-entry.mjs',
            'src/entry/production-stable-subject-authority.mjs',
            'src/entry/stable-entry.mjs',
            'src/entry/stable-runner-state.mjs',
          ]);

          function rewriteComponentMembership(component, files) {
            const selected = new Set(files);
            const manifestPath = path.join(component, '.devbridge-entry-install.json');
            const manifest = JSON.parse(readFileSync(manifestPath, 'utf8'));
            for (const item of manifest.files) {
              if (!selected.has(item.path)) rmSync(path.join(component, ...item.path.split('/')), { force: true });
            }
            manifest.files = manifest.files.filter((item) => selected.has(item.path));
            writeFileSync(manifestPath, JSON.stringify(manifest, null, 2) + String.fromCharCode(10));
          }

          function clearInstallerOwnershipReceipts(home) {
            rmSync(path.join(home, 'entry', 'ownership-receipts'), { recursive: true, force: true });
            rmSync(path.join(home, 'entry', 'ownership-scratch'), { recursive: true, force: true });
          }

          test('historical permanent-entry membership upgrades through exact closed compatibility', async () => {
            const root = mkdtempSync(path.join(tmpdir(), 'devbridge-historical-entry-upgrade-'));
            const fixture = fixtureRepository(root);
            const home = path.join(root, 'home');
            const args = parseInstallArgs(['--ref', 'main', '--home', home], { environment: {}, homeDirectory: root });
            const initial = await installDevBridge(args, installDependencies(fixture.source));
            const historicalHead = initial.componentHead;
            const historicalComponent = path.join(home, 'entry', 'components', historicalHead);

            rewriteComponentMembership(historicalComponent, HISTORICAL_ENTRY_COMPONENT_FILES);
            assert.equal(verifyInstalledComponent(historicalComponent, historicalHead, fixture.source), false);
            clearInstallerOwnershipReceipts(home);

            const nextHead = fixture.advance();
            const upgraded = await installDevBridge(args, installDependencies(fixture.source));
            assert.equal(upgraded.componentHead, nextHead);
            assert.equal(existsSync(historicalComponent), true);

            const previous = path.join(home, 'bin', 'devbridge-entry.previous.mjs');
            const previousStatus = JSON.parse(run(process.execPath, [previous, 'entry-install-status']).stdout.trim());
            assert.equal(previousStatus.componentHead, historicalHead);
            const currentStatus = JSON.parse(run(process.execPath, [upgraded.wrappers.javascript, 'entry-install-status']).stdout.trim());
            assert.equal(currentStatus.componentHead, nextHead);
          });

          test('historical reference compatibility rejects unknown component membership', async () => {
            const root = mkdtempSync(path.join(tmpdir(), 'devbridge-historical-entry-reject-'));
            const fixture = fixtureRepository(root);
            const home = path.join(root, 'home');
            const args = parseInstallArgs(['--ref', 'main', '--home', home], { environment: {}, homeDirectory: root });
            const initial = await installDevBridge(args, installDependencies(fixture.source));
            const historicalHead = initial.componentHead;
            const historicalComponent = path.join(home, 'entry', 'components', historicalHead);
            const unknownMembership = [
              ...HISTORICAL_ENTRY_COMPONENT_FILES,
              'src/entry/runner-cache-composition.mjs',
            ];

            rewriteComponentMembership(historicalComponent, unknownMembership);
            clearInstallerOwnershipReceipts(home);
            fixture.advance();

            await assert.rejects(
              () => installDevBridge(args, installDependencies(fixture.source)),
              /Recognized primary file does not reference an accepted subject/u,
            );
            const primary = path.join(home, 'bin', 'devbridge-entry.mjs');
            const status = JSON.parse(run(process.execPath, [primary, 'entry-install-status']).stdout.trim());
            assert.equal(status.componentHead, historicalHead);
          });
          `;
          appendFileSync(testPath, '\n' + regression.trim() + '\n');

          const evidencePath = 'docs/testing/DB-HO103-issue-391-permanent-entry-production-receipts.md';
          const evidence = [
            '## Physical historical-membership correction — 2026-08-31',
            '',
            'Canonical-home physical re-entry exposed a generation-compatibility defect after the original #362 ownership-composition correction was physically falsified. The installed primary wrapper referenced exact subject `b535a5d2ce04a420ac3e0f559be712009747c8e2`, whose accepted permanent-entry manifest contains the 14-file closure used before runner-cache ownership/runtime dependencies were added. Current reference acceptance incorrectly revalidated that historical component against the later 26-file closure, so a statically recognized primary failed with `Recognized primary file does not reference an accepted subject.`',
            '',
            'The correction keeps current component publication/verification unchanged and adds one closed historical reference-verification set matching the previously accepted 14-file generation. Only primary/previous reference acceptance may use it; new component installation and `verifyInstalledComponent` remain bound to the current closure. Unknown intermediate/subset membership remains fail-closed. Regression coverage removes receipt state to model a pre-receipt canonical installation, proves an exact historical wrapper/component can advance while remaining preserved as previous authority, and proves a 15-file unknown membership is rejected without replacing the primary.',
            '',
            'This does not authorize manual canonical-home mutation, PATH/service/ACL changes, construction, VM/image work, repository execution, or GPU/CUDA work. Hosted exact-head qualification and a new ordinary non-elevated physical retry remain required before the Stage 8 physical frontier advances.',
          ].join('\n');
          const existingEvidence = readFileSync(evidencePath, 'utf8');
          if (!existingEvidence.includes('## Physical historical-membership correction — 2026-08-31')) {
            appendFileSync(evidencePath, '\n' + evidence + '\n');
          }
          NODE
      - name: Regenerate standalone artifacts
        run: node scripts/build-standalone-artifacts.mjs
      - name: Focused installer regression
        run: node --test test/self-install-entry.test.js
      - name: Bounded preflight
        run: npm run preflight -- --bound-targeted-test-concurrency
      - name: Diff hygiene and commit candidate
        shell: bash
        run: |
          git diff --check
          rm .github/workflows/fix-historical-entry-component-clean.yml
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            docs/testing/DB-HO103-issue-391-permanent-entry-production-receipts.md \
            install-devbridge.mjs \
            src/install/permanent-entry-installer.mjs \
            test/self-install-entry.test.js | sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(installer): verify historical entry components'
          git push origin HEAD:${GITHUB_REF_NAME}
