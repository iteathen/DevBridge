name: Ubuntu package authority diagnostic

on:
  pull_request:
    paths:
      - .github/workflows/ubuntu-package-authority-diagnostic.yml

permissions:
  contents: read

jobs:
  exact-transaction:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: ubuntu:26.04
    env:
      DEBIAN_FRONTEND: noninteractive
      SNAPSHOT: 20260821T230000Z
    steps:
      - name: Observe exact base and sources
        shell: bash
        run: |
          set -euxo pipefail
          cat /etc/os-release
          apt-get --version
          find /etc/apt -maxdepth 2 -type f \( -name '*.list' -o -name '*.sources' \) -print -exec sed -n '1,200p' {} \;

      - name: Bootstrap release trust
        shell: bash
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates=20260223
          dpkg-query --show --showformat='${Package}=${Version}\n' ca-certificates

      - name: Update exact snapshot metadata
        shell: bash
        run: |
          set -euxo pipefail
          apt-get --error-on=any --snapshot "$SNAPSHOT" update

      - name: Simulate exact transaction
        shell: bash
        run: |
          set -euxo pipefail
          apt-get -o Debug::pkgProblemResolver=yes --snapshot "$SNAPSHOT" --simulate install -y --no-install-recommends \
            build-essential=12.12ubuntu2 \
            cmake=4.2.3-2ubuntu2 \
            git=1:2.53.0-1ubuntu1 \
            linux-cloud-tools-virtual=7.0.0-14.14 \
            nodejs=22.22.1+dfsg+~cs22.19.15-1ubuntu1 \
            npm=9.2.0~ds3-1

      - name: Download exact transaction
        shell: bash
        run: |
          set -euxo pipefail
          apt-get --snapshot "$SNAPSHOT" --download-only install -y --no-install-recommends \
            build-essential=12.12ubuntu2 \
            cmake=4.2.3-2ubuntu2 \
            git=1:2.53.0-1ubuntu1 \
            linux-cloud-tools-virtual=7.0.0-14.14 \
            nodejs=22.22.1+dfsg+~cs22.19.15-1ubuntu1 \
            npm=9.2.0~ds3-1

      - name: Install exact transaction
        shell: bash
        run: |
          set -euxo pipefail
          apt-get --snapshot "$SNAPSHOT" install -y --no-install-recommends \
            build-essential=12.12ubuntu2 \
            cmake=4.2.3-2ubuntu2 \
            git=1:2.53.0-1ubuntu1 \
            linux-cloud-tools-virtual=7.0.0-14.14 \
            nodejs=22.22.1+dfsg+~cs22.19.15-1ubuntu1 \
            npm=9.2.0~ds3-1
