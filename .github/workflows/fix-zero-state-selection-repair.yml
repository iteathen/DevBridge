name: Temporary zero-state selection repair qualification

on:
  push:
    branches:
      - fix/362-zero-state-selection-repair

permissions:
  contents: write

concurrency:
  group: zero-state-selection-repair
  cancel-in-progress: false

jobs:
  qualify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Regenerate standalone bootstrap
        run: node scripts/build-standalone-artifacts.mjs
      - name: Focused zero-state repair regressions
        run: node --test test/zero-state-bootstrap.test.js test/zero-state-exact-source.test.js test/installer-stage0-nested-lego.test.js test/standalone-launcher.test.js
      - name: Bounded preflight
        run: npm run preflight -- --bound-targeted-test-concurrency
      - name: Diff hygiene and commit generated artifact
        shell: bash
        run: |
          git diff --check
          rm .github/workflows/fix-zero-state-selection-repair.yml
          git add -A
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            .github/workflows/fix-zero-state-selection-repair.yml \
            bootstrap-devbridge.mjs | sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(bootstrap): regenerate selection repair artifact'
          git push origin HEAD:${GITHUB_REF_NAME}
