name: Temporary historical entry cleanup

on:
  push:
    branches:
      - fix/362-historical-entry-component-verification

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.ref }}
          persist-credentials: true
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Normalize callback formatting
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const file = 'src/install/permanent-entry-installer.mjs';
          let text = readFileSync(file, 'utf8');
          const before = `      acceptReference: (reference) => {
                const componentRoot = path.join(components, reference.subject);
                return componentStore.verify(componentRoot, reference.subject, sourceRepository)
                  || historicalComponentStores.some((store) => store.verify(
                    componentRoot,
                    reference.subject,
                    sourceRepository,
                  ));
              },`;
          const actual = `      acceptReference: (reference) => {
      const componentRoot = path.join(components, reference.subject);
      return componentStore.verify(componentRoot, reference.subject, sourceRepository)
        || historicalComponentStores.some((store) => store.verify(
          componentRoot,
          reference.subject,
          sourceRepository,
        ));
    },`;
          if (!text.includes(actual)) throw new Error('historical reference callback shape changed');
          text = text.replace(actual, before);
          writeFileSync(file, text);
          NODE
      - name: Regenerate standalone artifacts
        run: node scripts/build-standalone-artifacts.mjs
      - name: Focused installer regression
        run: node --test test/self-install-entry.test.js
      - name: Bounded preflight
        run: npm run preflight -- --bound-targeted-test-concurrency
      - name: Rewrite isolated branch to one clean candidate
        shell: bash
        run: |
          git diff --check
          rm .github/workflows/cleanup-historical-entry-fix.yml
          git reset --soft ecb6edf73e48e6a620824b5f95be6d25b4ae012a
          git add -A
          git diff --cached --check
          actual="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' \
            docs/testing/DB-HO103-issue-391-permanent-entry-production-receipts.md \
            install-devbridge.mjs \
            src/install/permanent-entry-installer.mjs \
            test/self-install-entry.test.js | sort)"
          test "$actual" = "$expected"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(installer): verify historical entry components'
          git push --force-with-lease origin HEAD:${GITHUB_REF_NAME}
