name: Ubuntu release evidence probe

on:
  workflow_dispatch:
  push:
    branches:
      - codex/issue-417-ubuntu-release-evidence-preparation

permissions:
  contents: read

jobs:
  exact-release-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install read-only media tools
        run: |
          sudo apt-get update --quiet=2
          sudo apt-get install --yes --no-install-recommends xorriso squashfs-tools
      - name: Observe exact ISO target and snapshot inputs
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/devbridge-ubuntu-release-evidence"
          iso="$root/ubuntu-26.04-live-server-amd64.iso"
          mkdir -p "$root"
          curl --fail --location --silent --show-error --max-time 1200 \
            --output "$iso" \
            https://releases.ubuntu.com/26.04/ubuntu-26.04-live-server-amd64.iso
          printf '%s  %s\n' \
            dec49008a71f6098d0bcfc822021f4d042d5f2db279e4d75bdd981304f1ca5d9 \
            "$iso" | sha256sum --check --strict
          test "$(stat --format=%s "$iso")" = 2918598656

          node scripts/prepare-ubuntu-capsule-solver-inputs.mjs \
            --destination "$root/workspace" \
            --media "$iso" \
            --media-sha256 dec49008a71f6098d0bcfc822021f4d042d5f2db279e4d75bdd981304f1ca5d9 \
            --media-bytes 2918598656 \
            --distribution ubuntu \
            --release 26.04 \
            --codename resolute \
            --architecture amd64 \
            --snapshot 20260821T230000Z \
            --install-source ubuntu-server \
            --leaf-layer ubuntu-server-minimal.ubuntu-server \
            --layers ubuntu-server-minimal,ubuntu-server-minimal.ubuntu-server \
            --packages build-essential,cmake,git,linux-cloud-tools-virtual,nodejs,npm,openssh-server \
            --xorriso /usr/bin/xorriso \
            --unsquashfs /usr/bin/unsquashfs \
            --apt-get /usr/bin/apt-get \
            --duration-ms 600000 \
            >"$root/prepared-result.json"

          jq '{protocol,receipt:.receipt|{media,installer,apt,requestedPackages}}' "$root/prepared-result.json"

          export DEVBRIDGE_EVIDENCE_ROOT="$root"
          node --input-type=module <<'NODE'
          import path from 'node:path';
          import { readFile } from 'node:fs/promises';
          import { UbuntuAptTransactionSolver } from './src/release/ubuntu-apt-transaction-solver.mjs';
          const root = process.env.DEVBRIDGE_EVIDENCE_ROOT;
          const prepared = JSON.parse(await readFile(path.join(root, 'prepared-result.json'), 'utf8'));
          const solution = await new UbuntuAptTransactionSolver({ executable: '/usr/bin/apt-get' }).solve(prepared.solverRequest);
          console.log(`solution-base=${solution.transaction.basePackageStateSha256}`);
          console.log(`solution-result=${solution.transaction.resultPackageStateSha256}`);
          console.log(`solution-selected=${solution.selectedPackages.length}`);
          console.log(`solution-requested=${JSON.stringify(solution.transaction.requestedPackages)}`);
          NODE
