name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Cheap preflight
        timeout-minutes: 1
        run: npm run preflight
      - name: DevBridge identity audit
        timeout-minutes: 1
        run: node --test test/product-identity.test.js
      - name: Standalone installer regression
        timeout-minutes: 1
        run: node --test test/standalone-launcher.test.js

  test:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Prepare Bubblewrap sandbox provider
        if: runner.os == 'Linux'
        timeout-minutes: 5
        shell: bash
        run: |
          set -euxo pipefail
          profile=/usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          if ! command -v bwrap >/dev/null 2>&1 || ! command -v apparmor_parser >/dev/null 2>&1 || [ ! -f "$profile" ]; then
            sudo apt-get \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15 \
              update
            sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
              bubblewrap apparmor apparmor-profiles
          fi
          test -x "$(command -v bwrap)"
          test -f "$profile"
          sudo install -m 0644 "$profile" /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
          bwrap --version
      - name: Tests (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 5
        env:
          DEVBRIDGE_REQUIRE_SANDBOX_TEST: '1'
        run: npm test
      - name: Tests (Windows x64 unit and regression)
        if: runner.os == 'Windows'
        timeout-minutes: 5
        run: npm test
      - name: Doctor smoke test (Linux)
        if: runner.os == 'Linux'
        timeout-minutes: 1
        run: node src/cli.js doctor --config config/devbridge.example.json
      - name: Doctor smoke test (Windows x64 unsupported-host truthfulness)
        if: runner.os == 'Windows'
        timeout-minutes: 1
        run: node src/cli.js doctor --config config/devbridge.example.json

  windows-sandbox:
    name: Windows 11 ProcessContainer qualification
    timeout-minutes: 12
    runs-on: windows-11-arm
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
          architecture: arm64
      - name: Cheap preflight
        timeout-minutes: 1
        run: npm run preflight
      - name: Prepare Windows process-container sandbox provider
        id: windows-sandbox
        timeout-minutes: 3
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host "Windows=$([System.Environment]::OSVersion.VersionString) Arch=$env:PROCESSOR_ARCHITECTURE Node=$(node -p process.arch)"
          $sandboxHome = Join-Path $env:RUNNER_TEMP 'devbridge-sandbox-home'
          $sandboxExecutable = node src/bootstrap/windows-sandbox-runtime.mjs --home $sandboxHome
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath $sandboxExecutable -PathType Leaf)) {
            throw "Windows sandbox bootstrap did not produce an executable: $sandboxExecutable"
          }
          & $sandboxExecutable --probe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "executable=$sandboxExecutable" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Windows sandbox qualification
        timeout-minutes: 7
        env:
          DEVBRIDGE_REQUIRE_SANDBOX_TEST: '1'
          DEVBRIDGE_WINDOWS_SANDBOX_EXECUTABLE: ${{ steps.windows-sandbox.outputs.executable }}
        run: node --test --test-concurrency=1 test/bootstrap-candidate-sandbox.test.js test/deterministic-sandbox.test.js test/doctor-capabilities.test.js test/doctor-enforcement-reporting.test.js test/worker-sandbox.test.js
      - name: Doctor proves verified Windows execution
        timeout-minutes: 2
        env:
          DEVBRIDGE_REQUIRE_SANDBOX_TEST: '1'
          DEVBRIDGE_WINDOWS_SANDBOX_EXECUTABLE: ${{ steps.windows-sandbox.outputs.executable }}
        run: node src/cli.js doctor --config config/devbridge.example.json
