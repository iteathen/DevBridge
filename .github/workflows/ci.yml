name: CI

on:
  push:
    branches:
      - main
      - 'sol/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install Bubblewrap sandbox provider
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
      - name: Cheap preflight
        run: npm run preflight
      - name: Tests
        env:
          PATCH_POLLER_REQUIRE_SANDBOX_TEST: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: npm test
      - name: Doctor smoke test
        run: node src/cli.js doctor --config config/patch-poller.example.json
