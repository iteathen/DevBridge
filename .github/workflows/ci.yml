name: CI

on:
  push:
    branches:
      - main
      - 'sol/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Cheap preflight
        run: npm run preflight
      - name: Tests
        run: npm test
      - name: Doctor smoke test
        run: node src/cli.js doctor --config config/patch-poller.example.json
