name: CI

on:
  push:
    branches:
      - main
      - 'sol/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install Bubblewrap sandbox provider
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles
          test -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - name: Cheap preflight
        run: npm run preflight
      - name: Issue 30 config tests
        run: node --test test/config.test.js
      - name: Manifest argv envelope
        run: node --test --test-name-pattern="local manifest materializes" test/local-operation-manifest.test.js
      - name: Manifest parameter boundary
        run: node --test --test-name-pattern="dynamic manifest parameters" test/local-operation-manifest.test.js
      - name: Manifest nonempty guard
        run: node --test --test-name-pattern="requireAnyParameter" test/local-operation-manifest.test.js
      - name: Manifest directory recovery
        run: node --test --test-name-pattern="local manifest directory loading" test/local-operation-manifest.test.js
      - name: Onboarding help parser
        run: node --test --test-name-pattern="help parser synthesizes" test/tool-onboarding.test.js
      - name: Onboarding sandbox and persistence
        run: node --test --test-name-pattern="automatic onboarding requires" test/tool-onboarding.test.js
      - name: Onboarding unavailable and blocked
        run: node --test --test-name-pattern="unavailable or blocked" test/tool-onboarding.test.js
      - name: Onboarding local policy
        run: node --test --test-name-pattern="local onboarding policy" test/tool-onboarding.test.js
      - name: Issue 30 schema tests
        run: node --test test/dynamic-tool-schema.test.js
      - name: Issue 49 coordination boundary tests
        run: >-
          node --test
          test/agent-identity.test.js
          test/task-lease.test.js
          test/task-lease-store.test.js
          test/task-lease-store-reconciliation.test.js
          test/task-lease-manager.test.js
          test/coordination-config.test.js
          test/task-lease-dispatch.test.js
          test/lease-execution-context.test.js
          test/lease-process-abort.test.js
          test/agent-branch-namespace.test.js
          test/task-lease-control-path.test.js
          test/task-lease-effect-frontier.test.js
      - name: Issue 49 baseline drift boundary tests
        run: >-
          node --test
          test/workspace-manager.test.js
          test/baseline-reverify.test.js
          test/workspace-publication-cas.test.js
      - name: Tests
        env:
          PATCH_POLLER_REQUIRE_SANDBOX_TEST: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: npm test
      - name: Doctor smoke test
        run: node src/cli.js doctor --config config/patch-poller.example.json
