name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
      - name: Cheap preflight
        timeout-minutes: 1
        run: npm run preflight
      - name: DevBridge identity audit
        timeout-minutes: 1
        run: node --test test/product-identity.test.js
      - name: Standalone installer regression
        timeout-minutes: 1
        run: node --test test/standalone-launcher.test.js

  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.16.0
      - name: Repository-execution architecture gates
        timeout-minutes: 1
        run: node --test test/repository-execution.test.js test/repository-execution-boundary-absence.test.js test/deterministic-execution-boundary.test.js test/process-runner.test.js test/worker-exchange.test.js test/local-operation-manifest.test.js test/tool-onboarding.test.js
      - name: Tests (non-Windows default)
        if: runner.os != 'Windows'
        timeout-minutes: 6
        run: npm test
      - name: Tests (Windows serialized)
        if: runner.os == 'Windows'
        timeout-minutes: 6
        run: npm test -- --test-concurrency=1
      - name: Doctor smoke test
        timeout-minutes: 1
        run: node src/cli.js doctor --config config/devbridge.example.json
