name: CI

on:
  push:
    branches:
      - main
      - 'sol/**'
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Install Bubblewrap sandbox provider
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap apparmor-profiles
          test -f /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          sudo install -m 0644 /usr/share/apparmor/extra-profiles/bwrap-userns-restrict /etc/apparmor.d/bwrap-userns-restrict
          sudo apparmor_parser -r /etc/apparmor.d/bwrap-userns-restrict
      - name: Cheap preflight
        run: npm run preflight
      - name: Issue 30 config tests
        run: node --test test/config.test.js
      - name: Issue 30 manifest tests
        run: node --test test/local-operation-manifest.test.js
      - name: Issue 30 onboarding tests
        env:
          PATCH_POLLER_REQUIRE_SANDBOX_TEST: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: node --test test/tool-onboarding.test.js
      - name: Issue 30 schema tests
        run: node --test test/dynamic-tool-schema.test.js
      - name: Tests
        env:
          PATCH_POLLER_REQUIRE_SANDBOX_TEST: ${{ runner.os == 'Linux' && '1' || '0' }}
        run: npm test
      - name: Doctor smoke test
        run: node src/cli.js doctor --config config/patch-poller.example.json
