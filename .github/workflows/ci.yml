name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    timeout-minutes: 3
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Cheap preflight
        timeout-minutes: 1
        run: npm run preflight
      - name: DevBridge identity audit
        timeout-minutes: 1
        run: node --test test/product-identity.test.js
      - name: Standalone installer regression
        timeout-minutes: 1
        run: node --test test/standalone-launcher.test.js

  test:
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Repository-execution architecture gates
        timeout-minutes: 1
        run: node --test test/repository-execution.test.js test/deterministic-execution-boundary.test.js test/process-runner.test.js test/worker-exchange.test.js
      - name: Tests
        timeout-minutes: 3
        run: npm test
      - name: Doctor smoke test
        timeout-minutes: 1
        run: node src/cli.js doctor --config config/devbridge.example.json
