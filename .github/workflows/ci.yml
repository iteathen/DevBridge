name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    timeout-minutes: 11
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Cheap preflight (non-Windows default)
        if: runner.os != 'Windows'
        timeout-minutes: 7
        run: npm run preflight -- --ci-qualification --static-only
      - name: Cheap preflight (Windows bounded)
        if: runner.os == 'Windows'
        timeout-minutes: 7
        run: npm.cmd run preflight -- --ci-qualification --static-only

  test:
    needs: smoke
    timeout-minutes: 14
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (node24)
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0 (node24)
        with:
          node-version: 22.16.0
          package-manager-cache: false
      - name: Tests (non-Windows default)
        if: runner.os != 'Windows'
        timeout-minutes: 6
        run: npm test
      - name: Tests (Windows serialized)
        if: runner.os == 'Windows'
        timeout-minutes: 10
        run: npm.cmd test -- --test-concurrency=1
      - name: Doctor smoke test
        timeout-minutes: 1
        run: node src/cli.js doctor --config config/devbridge.example.json
