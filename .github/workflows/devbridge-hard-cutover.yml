name: DevBridge Hard Cutover

on:
  push:
    branches:
      - refactor/devbridge-hard-cutover

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.16.0
      - name: Apply deterministic cutover
        if: ${{ hashFiles('scripts/devbridge-hard-cutover.mjs') != '' }}
        run: node scripts/devbridge-hard-cutover.mjs
      - name: Commit transformed tree
        if: ${{ hashFiles('scripts/devbridge-hard-cutover.mjs') == '' }}
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No transformation changes to commit."
            exit 0
          fi
          git config user.name "DevBridge Cutover"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "refactor: hard cut over live identity to DevBridge"
          git push origin HEAD:refactor/devbridge-hard-cutover
